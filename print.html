<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Blank Spring Garden Frames</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Checkerboard background to prove the frames are transparent inside */
        .checkerboard {
            background-color: #e5e5f7;
            background-image:  radial-gradient(#a1a1aa 0.5px, transparent 0.5px), radial-gradient(#a1a1aa 0.5px, #e5e5f7 0.5px);
            background-size: 20px 20px;
            background-position: 0 0,10px 10px;

</head>
<body class="bg-zinc-950 flex flex-col items-center justify-start min-h-screen p-8 font-sans text-white">

    <div class="text-center mb-12">
        <h1 class="text-4xl font-extrabold text-[#faecec] tracking-tight mb-2">Spring Garden Overlays</h1>
        <p class="text-[#93a897] font-medium tracking-widest uppercase text-sm">VibeShoot Asset Extractor</p>
        <p class="text-sm text-zinc-500 mt-4">Click below to download the blank, transparent PNG frames for your photobooth.</p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-16 w-full max-w-5xl items-start justify-items-center">

        <!-- ASSET 1: SINGLE PHOTO FRAME -->
        <div class="flex flex-col items-center w-full">
            <h2 class="text-xl font-bold mb-4 text-[#caa366] uppercase tracking-wider">1. Single Photo Frame</h2>
            <button onclick="downloadImage('single-svg', 'spring_single_frame.png')" class="mb-8 w-full max-w-xs py-4 bg-gradient-to-r from-[#faecec] to-[#f4dada] text-[#6d452b] font-extrabold uppercase tracking-widest rounded-xl hover:scale-[1.02] shadow-[0_4px_20px_rgba(250,236,236,0.15)] transition duration-200">
                📥 Download 1-Photo (PNG)
            </button>
            <div class="relative w-[280px] h-[420px] checkerboard shadow-[0_0_40px_rgba(0,0,0,0.5)] rounded-xl overflow-hidden border border-zinc-700">
                
                <!-- SVG SINGLE FRAME (Blank) -->
                <svg id="single-svg" viewBox="0 0 1200 1800" xmlns="http://www.w3.org/2000/svg" class="absolute inset-0 w-full h-full">
                    <defs>
                        <g id="blush-flower">
                            <circle cx="-15" cy="-15" r="18" fill="#f4dada" opacity="0.9"/>
                            <circle cx="15" cy="-15" r="18" fill="#faecec" opacity="0.9"/>
                            <circle cx="-15" cy="15" r="18" fill="#faecec" opacity="0.9"/>
                            <circle cx="15" cy="15" r="18" fill="#f4dada" opacity="0.9"/>
                            <circle cx="0" cy="0" r="10" fill="#caa366"/>
                        </g>
                        <g id="sage-leaf">
                            <path d="M0,0 C-20,-30 0,-60 30,-60 C60,-30 30,-10 0,0 Z" fill="#93a897" opacity="0.85"/>
                        </g>
                        <g id="gold-vine">
                            <path d="M0,0 Q30,-40 0,-80 T0,-160" fill="none" stroke="#caa366" stroke-width="4"/>
                        </g>
                    </defs>

                    <!-- Fully Transparent Image Area -->
                    <rect width="1200" height="1800" fill="none" />
                    
                    <rect x="40" y="40" width="1120" height="1720" fill="none" stroke="#caa366" stroke-width="8" />
                    <rect x="60" y="60" width="1080" height="1680" fill="none" stroke="#93a897" stroke-width="2" opacity="0.6"/>

                    <path d="M 0 1450 Q 600 1420 1200 1450 V 1800 H 0 Z" fill="#fdfbf7" opacity="0.97" />
                    
                    <g transform="translate(60, 60)"><use href="#gold-vine" transform="rotate(135)" /><use href="#sage-leaf" transform="rotate(110) scale(0.8)" /><use href="#blush-flower" transform="translate(20, 20) scale(0.8)" /></g>
                    <g transform="translate(1140, 60)"><use href="#gold-vine" transform="rotate(-135)" /><use href="#sage-leaf" transform="rotate(-110) scale(0.8)" /><use href="#blush-flower" transform="translate(-20, 20) scale(0.8)" /></g>
                    <g transform="translate(600, 1420)"><use href="#sage-leaf" transform="rotate(-45) translate(-40, 0) scale(0.7)" /><use href="#sage-leaf" transform="rotate(45) translate(40, 0) scale(0.7)" /><use href="#blush-flower" /></g>

                    <text x="600" y="1600" font-family="'Times New Roman', serif" font-weight="normal" font-size="80" fill="#caa366" text-anchor="middle" letter-spacing="6">Allen &amp; Marry</text>
                    <text x="600" y="1680" font-family="'Arial', sans-serif" font-weight="bold" font-size="28" fill="#93a897" text-anchor="middle" letter-spacing="10">SEPTEMBER 08, 2026</text>
                    <text x="600" y="1740" font-family="'Times New Roman', serif" font-style="italic" font-size="32" fill="#888" text-anchor="middle" letter-spacing="2">A Beautiful Beginning</text>
                </svg>
            </div>
        </div>

        <!-- ASSET 2: 3-PHOTO STRIP -->
        <div class="flex flex-col items-center w-full">
            <h2 class="text-xl font-bold mb-4 text-[#caa366] uppercase tracking-wider">2. 3-Photo Strip</h2>
            <button onclick="downloadImage('triple-svg', 'spring_triple_frame.png')" class="mb-8 w-full max-w-xs py-4 bg-gradient-to-r from-[#faecec] to-[#f4dada] text-[#6d452b] font-extrabold uppercase tracking-widest rounded-xl hover:scale-[1.02] shadow-[0_4px_20px_rgba(250,236,236,0.15)] transition duration-200">
                📥 Download 3-Strip (PNG)
            </button>
            <div class="relative w-[280px] h-[420px] checkerboard shadow-[0_0_40px_rgba(0,0,0,0.5)] rounded-xl overflow-hidden border border-zinc-700">
                
                <!-- SVG 3-PHOTO STRIP (Blank) -->
                <svg id="triple-svg" viewBox="0 0 1200 1800" xmlns="http://www.w3.org/2000/svg" class="absolute inset-0 w-full h-full">
                    
                    <!-- Punched Out Background -> Three transparent windows -->
                    <path d="M0,0 H1200 V1800 H0 Z 
                             M150,150 h900 v460 h-900 Z 
                             M150,670 h900 v460 h-900 Z 
                             M150,1190 h900 v460 h-900 Z" 
                          fill="#fdfbf7" fill-rule="evenodd" />
                    
                    <rect x="146" y="146" width="908" height="468" fill="none" stroke="#93a897" stroke-width="4" />
                    <rect x="146" y="666" width="908" height="468" fill="none" stroke="#93a897" stroke-width="4" />
                    <rect x="146" y="1186" width="908" height="468" fill="none" stroke="#93a897" stroke-width="4" />

                    <rect x="30" y="30" width="1140" height="1740" fill="none" stroke="#caa366" stroke-width="8" />

                    <text x="600" y="100" font-family="'Arial', sans-serif" font-weight="bold" font-size="28" fill="#caa366" text-anchor="middle" letter-spacing="12">SPRING GARDEN</text>

                    <g transform="translate(600, 640)">
                        <line x1="-150" y1="0" x2="150" y2="0" stroke="#caa366" stroke-width="2"/>
                        <circle cx="0" cy="0" r="10" fill="#f4dada"/>
                        <circle cx="0" cy="0" r="4" fill="#caa366"/>
                    </g>
                    <g transform="translate(600, 1160)">
                        <line x1="-150" y1="0" x2="150" y2="0" stroke="#caa366" stroke-width="2"/>
                        <circle cx="0" cy="0" r="10" fill="#f4dada"/>
                        <circle cx="0" cy="0" r="4" fill="#caa366"/>
                    </g>

                    <text x="600" y="1715" font-family="'Times New Roman', serif" font-weight="normal" font-size="48" fill="#caa366" text-anchor="middle" letter-spacing="6">Allen &amp; Marry</text>
                    <text x="600" y="1755" font-family="'Arial', sans-serif" font-weight="bold" font-size="22" fill="#93a897" text-anchor="middle" letter-spacing="8">08 . 09 . 2026</text>
                </svg>
            </div>
        </div>

    </div>

    <script>
        // Engine to export SVGs exactly as transparent PNGs
        function downloadImage(svgId, filename) {
            const svgElement = document.getElementById(svgId);
            const svgData = new XMLSerializer().serializeToString(svgElement);
            const canvas = document.createElement("canvas");
            
            // Output is specifically sized 1200x1800 for VibeShoot
            canvas.width = 1200;
            canvas.height = 1800;
            const ctx = canvas.getContext("2d");
            
            const img = new Image();
            img.onload = function() {
                // Clear the canvas to ensure it retains absolute transparency!
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0);
                
                // Export as PNG for transparency
                const dataURL = canvas.toDataURL('image/png');
                const downloadLink = document.createElement("a");
                downloadLink.download = filename;
                downloadLink.href = dataURL;
                downloadLink.click();
            };
            img.src = "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(svgData)));
        }
    </script>
</body>
</html>
