    <script>
        // --- SVG TEMPLATES WITH BOTANICAL ART ---
        const singleSVG = `
        <svg viewBox="0 0 1200 1800" xmlns="http://www.w3.org/2000/svg">

                <!-- Blush Flower -->

            <!-- Outer Gold Border -->

            <!-- Minimalist Gold & Blush Dividers -->
            <g transform="translate(600, 640)">

            <text x="600" y="1715" font-family="'Times New Roman', serif" font-weight="normal" font-size="48" fill="#caa366" text-anchor="middle" letter-spacing="6">Allen &amp; Marry</text>

        </svg>`;

        const imgSingleOverlay = new Image();
        imgSingleOverlay.src = "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(singleSVG)));
        
        const imgTripleOverlay = new Image();

        // State variables
        let userSingleImg = null;
        let userStripImgs = [null, null, null];
        let singleOffset = 0;
        let singleZoom = 1;

        // --- PRE-LOAD USER'S UPLOADED IMAGE ---
        const defaultImg = new Image();
        defaultImg.onload = () => {
            // Once loaded, set it as the default for all slots
            userSingleImg = defaultImg;
            userStripImgs = [defaultImg, defaultImg, defaultImg];
            renderSingleCanvas();
            renderStripCanvas();
        };
        // This references the exact filename you just uploaded to the chat!
        defaultImg.src = "81ee213a-9954-4772-a34e-0b432e682267-1_all_92243.jpg";

        // --- DRAWING ENGINE WITH ZOOM & OFFSET ---
        function drawImageCover(ctx, img, dstX, dstY, dstW, dstH, offsetY = 0, zoom = 1) {
            if(!img) return;
            
            // Calculate base scale to fill the rectangle completely
            let baseScale = Math.max(dstW / img.width, dstH / img.height);
            let finalScale = baseScale * zoom; // Apply user zoom
            
            let drawW = img.width * finalScale;
            let drawH = img.height * finalScale;
            
            // Center the image, then apply the Y offset
            let drawX = dstX + (dstW - drawW) / 2;
            let drawY = dstY + (dstH - drawH) / 2 + offsetY;
            
            ctx.drawImage(img, 0, 0, img.width, img.height, drawX, drawY, drawW, drawH);
        }

        function renderSingleCanvas() {
            const canvas = document.getElementById('canvas-single');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, 1200, 1800);
            
            // Draw photo with Zoom and Offset
            if (userSingleImg) {
                drawImageCover(ctx, userSingleImg, 0, 0, 1200, 1800, singleOffset, singleZoom);
            }
            
            // Draw overlay frame
            if (imgSingleOverlay.complete) ctx.drawImage(imgSingleOverlay, 0, 0);
        }

        function renderStripCanvas() {
            const canvas = document.getElementById('canvas-strip');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, 1200, 1800);
            
            const positionsY = [150, 670, 1190]; // Updated Y coordinates for the new strip design
            for (let i = 0; i < 3; i++) {
                if (userStripImgs[i]) drawImageCover(ctx, userStripImgs[i], 150, positionsY[i], 900, 460);
            }
            
            if (imgTripleOverlay.complete) ctx.drawImage(imgTripleOverlay, 0, 0);
        }

        // Overlay load fallbacks
        imgSingleOverlay.onload = renderSingleCanvas;
        imgTripleOverlay.onload = renderStripCanvas;

        // --- EVENT LISTENERS FOR CONTROLS ---
        document.getElementById('upload-single').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = () => { userSingleImg = img; renderSingleCanvas(); }
                img.src = event.target.result;
            }
            reader.readAsDataURL(file);
        });

        document.getElementById('offset-single').addEventListener('input', function(e) {
            singleOffset = parseInt(e.target.value);
            renderSingleCanvas();
        });

        document.getElementById('zoom-single').addEventListener('input', function(e) {
            singleZoom = parseFloat(e.target.value);
            renderSingleCanvas();
        });

        for(let i=1; i<=3; i++) {
            document.getElementById(`upload-strip-${i}`).addEventListener('change', function(e) {
                const file = e.target.files[0];

                    const img = new Image();
                    img.onload = () => { userStripImgs[i-1] = img; renderStripCanvas(); }
                    img.src = event.target.result;
                }
                reader.readAsDataURL(file);
            });
        }

            if(tab === 'single') {
                sTab.className = "px-6 py-2 rounded-full font-bold bg-[#caa366] text-black shadow-[0_0_15px_rgba(202,163,102,0.4)] transition"; 
                tTab.className = "px-6 py-2 rounded-full font-bold bg-zinc-800 text-zinc-300 hover:bg-zinc-700 transition";
                sSec.classList.replace('hidden', 'flex'); tSec.classList.replace('flex', 'hidden');
            } else {
                tTab.className = "px-6 py-2 rounded-full font-bold bg-[#caa366] text-black shadow-[0_0_15px_rgba(202,163,102,0.4)] transition"; 
                sTab.className = "px-6 py-2 rounded-full font-bold bg-zinc-800 text-zinc-300 hover:bg-zinc-700 transition";
                tSec.classList.replace('hidden', 'flex'); sSec.classList.replace('flex', 'hidden');
            }
        }

        // --- DOWNLOAD HANDLER ---
        function downloadCanvas(canvasId, filename) {
            const canvas = document.getElementById(canvasId);
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = canvas.width; tempCanvas.height = canvas.height;
            const tCtx = tempCanvas.getContext('2d');
            
            // JPEGs don't support transparency, so draw a white backdrop first
            tCtx.fillStyle = '#ffffff'; tCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
            tCtx.drawImage(canvas, 0, 0);
            
            const link = document.createElement('a');
            link.download = filename;
            link.href = tempCanvas.toDataURL('image/jpeg', 0.98); // High quality JPG
            link.click();
        }
    </script>
